[build]
  command = "npm run build"
  publish = "out"

# Serverless-Funktionen (Live-Demo E-Mail-Check, erreichbar unter /api/email-check).
# Benötigt die Umgebungsvariablen OPENAI_API_KEY und DEMO_SALT in Netlify.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Weiterleitungen alter Leistungsseiten (SIN-786). Die Seiten existieren nicht mehr,
# deshalb greifen die Regeln ohne `force`. Reihenfolge: erste passende Regel gewinnt.
[[redirects]]
  from = "/leistungen/webseiten"
  to = "/"
  status = 301

[[redirects]]
  from = "/leistungen/webseiten.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/leistungen/email-automatisierung"
  to = "/"
  status = 301

[[redirects]]
  from = "/leistungen/email-automatisierung.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/leistungen/individuelle-software"
  to = "/"
  status = 301

[[redirects]]
  from = "/leistungen/individuelle-software.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/leistungen/ki-automatisierung"
  to = "/leistungen/doku-assistent.html"
  status = 301

[[redirects]]
  from = "/leistungen/ki-automatisierung.html"
  to = "/leistungen/doku-assistent.html"
  status = 301

[[redirects]]
  from = "/leistungen"
  to = "/#leistungen"
  status = 301

[[redirects]]
  from = "/leistungen.html"
  to = "/#leistungen"
  status = 301

[[redirects]]
  from = "/preise"
  to = "/#ablauf"
  status = 301

[[redirects]]
  from = "/preise.html"
  to = "/#ablauf"
  status = 301

# Sicherheits-Header für alle Seiten
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formspree.io https://cloud.umami.is https://api-gateway.umami.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io"

# Gebaute Assets sind content-hashed und dürfen unbegrenzt gecacht werden
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
