# Build-Check (SIN-208): statischer Next.js-Export wie auf Netlify.
# Pflicht-Check `build` für main, damit kaputte Builds nicht live gehen.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Startet post-merge.yml nach einem Auto-Merge (SIN-213).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build (static export)
        run: npm run build
